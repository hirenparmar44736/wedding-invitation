<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B2E23"/>
      <stop offset="50%" stop-color="#2D4638"/>
      <stop offset="100%" stop-color="#182A1F"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF3CD"/>
      <stop offset="35%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#AA771C"/>
      <stop offset="100%" stop-color="#EED68B"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="600" cy="315" r="450" fill="url(#glow)"/>

  <!-- Vintage Borders -->
  <rect x="30" y="30" width="1140" height="570" fill="none" stroke="url(#gold)" stroke-width="1.5" stroke-opacity="0.6"/>
  <rect x="42" y="42" width="1116" height="546" fill="none" stroke="url(#gold)" stroke-width="0.8" stroke-dasharray="4 4" stroke-opacity="0.4"/>

  <!-- Corner Flourishes -->
  <g stroke="url(#gold)" fill="none" stroke-width="1.5" stroke-opacity="0.7">
    <path d="M42 90 C60 90 90 60 90 42"/>
    <path d="M1158 90 C1140 90 1110 60 1110 42"/>
    <path d="M42 540 C60 540 90 570 90 588"/>
    <path d="M1158 540 C1140 540 1110 570 1110 588"/>
  </g>

  <!-- Central Seal -->
  <g transform="translate(600, 160)">
    <circle r="52" fill="#24382C" stroke="url(#gold)" stroke-width="2.5"/>
    <circle r="46" fill="none" stroke="url(#gold)" stroke-width="0.8" stroke-dasharray="3 3"/>
    <text y="10" font-family="'Cinzel Decorative', Georgia, serif" font-size="28" font-weight="bold" fill="url(#gold)" text-anchor="middle" letter-spacing="2">H&amp;A</text>
  </g>

  <!-- Typography -->
  <text x="600" y="270" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" letter-spacing="6" fill="#D3DEC9" text-anchor="middle" font-weight="400">WITH THE BLESSINGS OF OUR FAMILIES</text>
  
  <text x="600" y="360" font-family="'Cormorant Garamond', Georgia, serif" font-size="68" font-weight="600" fill="url(#gold)" text-anchor="middle" letter-spacing="1">
    Hiren <tspan fill="#E5C768" font-size="44">♥</tspan> Ashlesha
  </text>

  <line x1="450" y1="400" x2="750" y2="400" stroke="url(#gold)" stroke-width="1" stroke-opacity="0.5"/>

  <text x="600" y="445" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" letter-spacing="4" fill="#F4EBD9" text-anchor="middle" font-weight="500">
    24 &amp; 25 FEBRUARY 2027
  </text>
  
  <text x="600" y="485" font-family="'Cormorant Garamond', Georgia, serif" font-size="22" font-style="italic" fill="#C5D3BC" text-anchor="middle">
    Family Residence — Umrala, Gujarat, India
  </text>

  <rect x="500" y="525" width="200" height="36" rx="18" fill="#1C2E24" stroke="url(#gold)" stroke-width="1"/>
  <text x="600" y="548" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" letter-spacing="3" fill="#EAD8A4" text-anchor="middle" font-weight="600">PREMIUM INVITATION</text>
</svg>
